<script type="text/babel" data-presets="react">
  // Mount each slide component into its corresponding <section>.
  const mount = (id, Comp) => {
    const el = document.getElementById(id);
    if (!el || typeof Comp !== 'function') return;
    const root = ReactDOM.createRoot(el);
    root.render(<Comp />);
  };
  mount('slide-01', Slide01);
  mount('slide-02', Slide02);
  mount('slide-03', Slide03);
  mount('slide-04', Slide04);
  mount('slide-05', Slide05);
  mount('slide-06', Slide06);
  mount('slide-07', Slide07);
  mount('slide-08', Slide08);
  mount('slide-09', Slide09);
  mount('slide-10', Slide10);
  mount('slide-11', Slide11);
  mount('slide-12', Slide12);
  mount('slide-13', Slide13);
  mount('slide-14', Slide14);
  mount('slide-15', Slide15);
  mount('slide-16', Slide16);
</script>
